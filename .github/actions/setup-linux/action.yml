name: Set up Linux build environment
description: Tauri's system libraries plus a minimal Rust toolchain.

inputs:
  rust-components:
    description: Extra rustup components, space-separated (e.g. "rustfmt clippy").
    required: false
    default: ""
  bundle-tools:
    description: Also install what `tauri build` needs to produce the .deb/.rpm/.AppImage.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Tauri Linux dependencies
      shell: bash
      run: |
        extra=()
        if [ "${{ inputs.bundle-tools }}" = "true" ]; then
          extra=(patchelf file xdg-utils)
        fi
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libdbus-1-dev \
          libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev \
          pkg-config \
          "${extra[@]}"

    - name: Install Rust
      shell: bash
      run: |
        components=()
        for c in ${{ inputs.rust-components }}; do
          components+=(--component "$c")
        done
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal "${components[@]}"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
