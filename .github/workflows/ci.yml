name: CI

# Fast checks only - nothing here produces an installer. Those come from
# bundle.yml (run it by hand from the Actions tab to get test builds) and
# release.yml (tag pushes), which reuses this file via workflow_call.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:

# Playwright is a devDependency of the screenshot script only, and nothing in
# CI captures screenshots. Without this, every `npm ci` here would download a
# ~180MB Chromium that no job goes on to use.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux
        with:
          rust-components: rustfmt clippy

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux

      - run: cargo test --workspace --locked

      - run: npm ci
      # vitest under jsdom - no browser and no display needed. --no-watch is
      # explicit rather than relying on the CLI's CI detection.
      - run: npm run test -- --no-watch
      # The production Angular build catches template errors the dev-mode
      # tests don't; it takes seconds, so it rides along here rather than
      # waiting for a bundle run.
      - run: npm run build
