name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

# Playwright is a devDependency of the screenshot script only, and nothing in
# CI captures screenshots. Without this, every `npm ci` here would download a
# ~180MB Chromium that no job goes on to use.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - run: cargo test --workspace --locked

      - run: npm ci
      # vitest under jsdom - no browser and no display needed. --no-watch is
      # explicit rather than relying on the CLI's CI detection.
      - run: npm run test -- --no-watch

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - run: cargo build --workspace --release --locked

      - run: npm ci
      - run: npm run build

  build-windows:
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - run: cargo build --workspace --release --locked

      - run: npm ci
      - run: npm run build

  release:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          pkg_version="$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag v$tag_version does not match src-tauri/Cargo.toml version $pkg_version"
            exit 1
          fi

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            patchelf \
            file \
            xdg-utils \
            jq

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npm run tauri build

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage

  release-windows:
    runs-on: windows-latest
    needs: [lint, test, build-windows, release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          pkg_version="$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag v$tag_version does not match src-tauri/Cargo.toml version $pkg_version"
            exit 1
          fi

      - run: npm ci
      - run: npm run tauri build

      - name: Package portable build
        shell: bash
        run: |
          version="$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)"
          mkdir -p target/release/bundle/portable
          cp target/release/bme.exe "target/release/bundle/portable/bme-${version}-windows-portable.exe"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/portable/*.exe
