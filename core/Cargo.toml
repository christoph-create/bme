[package]
name = "bme-core"
version = "0.9.0"
description = "Domain logic for bme: MQTT connection management, SQLite storage, and message templates"
authors = ["christoph-create <60292060+christoph-create@users.noreply.github.com>"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/christoph-create/bme"
readme = "../README.md"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "uuid", "chrono"] }
rusqlite_migration = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rumqttc = { version = "0.24", features = ["websocket"] }
log = "0.4"
# TLS backend is a stated choice, not a default. `rustls-no-provider` (rather
# than reqwest's `rustls`) is what keeps the crypto provider ours: the `rustls`
# feature would pull aws-lc-rs, which needs cmake and a C toolchain - and NASM
# on Windows - in every CI job. `ring` is already in the tree via rumqttc, so
# this adds no new build tooling. The cost is that no provider is installed
# process-wide by default; `update::github` does that explicitly.
#
# `rustls-platform-verifier` comes along either way, so roots are the OS trust
# store - the same place rumqttc's TLS gets them. `system-proxy` is listed back
# because turning defaults off would otherwise drop it, and a corporate-proxy
# user hitting a silent update-check failure is a bug that never gets reported.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "system-proxy",
    "json",
    "charset",
    "http2",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
# rumqttc 0.24 is on rustls 0.22 (through tokio-rustls 0.25) while reqwest above
# is on 0.23, so a `ClientConfig` handed to `TlsConfiguration::Rustls` has to be
# built with *rumqttc's* rustls - a 0.23 one is a different type. Hence the
# renamed entry rather than unifying the two. Both versions, and the two crates
# below, are already in Cargo.lock as rumqttc's own dependencies; the default
# features here are exactly `logging, ring, tls12`, so the no-cmake build
# guarantee above still holds.
rumqttc-rustls = { package = "rustls", version = "0.22" }
rustls-native-certs = "0.7"
rustls-pemfile = "2"
