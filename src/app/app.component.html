@if (workspaces.hasOpenWorkspaces()) {
  <app-workspace-tabs />
}

<div class="shell-body">
  <!-- Outside the router outlet on purpose: switching tabs must not destroy a
       workspace. The `/broker/:id` route only says which one is showing. -->
  <app-workspace-host />
  <router-outlet />
</div>

@if (notifier.available(); as release) {
  <app-update-dialog
    [release]="release"
    [currentVersion]="notifier.currentVersion()"
    (opened)="openRelease(release.url)"
    (dismissed)="notifier.dismiss()"
    (skipped)="notifier.skip()"
  />
}
