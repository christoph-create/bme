<header class="page-header">
  <div class="header-title">
    <h1>Broker Workspace</h1>
    @if (connecting()) {
      <span class="status-pill connecting">Connecting…</span>
    } @else if (connectError()) {
      <span class="status-pill error">Connection failed</span>
    } @else {
      <span class="status-pill connected">Connected</span>
    }
  </div>
  <button type="button" class="btn-disconnect" (click)="disconnect()">
    Disconnect
  </button>
</header>

@if (connectError()) {
  <div class="connect-error-banner">
    <span>{{ connectError() }}</span>
    <button type="button" (click)="connect()">Retry</button>
  </div>
}

<div
  class="layout"
  [class.resizing-col]="resizing() === 'column'"
  [class.resizing-row]="resizing() === 'row'"
  [style.grid-template-columns]="sidebarWidth() + 'px 6px 1fr'"
  [style.grid-template-rows]="'1fr 6px ' + publishHeight() + 'px'"
>
  <aside class="sidebar">
    <app-subscriptions-panel [connectionId]="connectionId" />
    <app-topic-tree
      [connectionId]="connectionId"
      (topicSelected)="selectedTopic.set($event)"
    />
  </aside>

  <div class="resizer resizer-col" (pointerdown)="startColumnResize($event)"></div>

  <section class="messages">
    <app-message-stream
      [connectionId]="connectionId"
      [topic]="selectedTopic()"
    />
  </section>

  <div class="resizer resizer-row" (pointerdown)="startRowResize($event)"></div>

  <section class="publish">
    <app-publish-panel
      [connectionId]="connectionId"
      [topic]="selectedTopic()"
    />
  </section>
</div>
