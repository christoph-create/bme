<div class="header">
  <span class="label">Publish</span>
  @if (publishedFlash()) {
    <span class="flash">✓ Published</span>
  }
</div>

<form class="body" [formGroup]="form" (ngSubmit)="publish()">
  <div class="row">
    <input
      class="topic-input mono"
      formControlName="topic"
      placeholder="topic"
    />
    <div class="segmented">
      @for (opt of formatOptions; track opt) {
        <div
          class="segment"
          [class.selected]="format() === opt"
          (click)="selectFormat(opt)"
          (keydown.enter)="selectFormat(opt)"
          role="button"
          tabindex="0"
        >
          {{ opt.toUpperCase() }}
        </div>
      }
    </div>
    <app-qos-select [(value)]="qos" />
    <label class="retain-field">
      <input
        type="checkbox"
        class="retain-checkbox"
        [checked]="retain()"
        (change)="toggleRetain()"
      />
      Retain
    </label>
  </div>

  @if (format() === "json") {
    <div class="format-row">
      <span
        class="format-action"
        (click)="formatPayload()"
        (keydown.enter)="formatPayload()"
        role="button"
        tabindex="0"
      >
        Format
      </span>
    </div>
  }

  <textarea
    class="payload-input mono"
    formControlName="payload"
    placeholder="payload"
  ></textarea>

  @if (formatError() ?? publishError() ?? templateSaveError(); as message) {
    <p class="error">{{ message }}</p>
  }

  <div class="actions">
    @if (templateSaved()) {
      <span class="flash">✓ Saved as template</span>
    }
    <button
      type="button"
      class="btn-save-template"
      [disabled]="form.invalid"
      (click)="saveAsTemplate()"
    >
      Save as Template
    </button>
    <button type="submit" class="btn-publish" [disabled]="form.invalid">
      Publish
    </button>
  </div>
</form>
