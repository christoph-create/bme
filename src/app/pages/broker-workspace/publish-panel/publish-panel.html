<div class="header">
  <span class="label">Publish</span>
  @if (publishedFlash()) {
    <span class="flash">✓ Published</span>
  }
</div>

<form class="body" [formGroup]="form" (ngSubmit)="publish()">
  <div class="row">
    <input
      class="topic-input mono"
      formControlName="topic"
      placeholder="topic"
    />
    <div class="segmented">
      @for (opt of formatOptions; track opt) {
        <div
          class="segment"
          [class.selected]="format() === opt"
          (click)="selectFormat(opt)"
          (keydown.enter)="selectFormat(opt)"
          role="button"
          tabindex="0"
        >
          {{ opt.toUpperCase() }}
        </div>
      }
    </div>
    <app-qos-select [(value)]="qos" />
    <label class="retain-field">
      <span>Retain</span>
      <span class="switch">
        <input
          type="checkbox"
          class="retain-checkbox"
          [checked]="retain()"
          (change)="toggleRetain()"
        />
        <span class="switch-track"></span>
      </span>
    </label>
  </div>

  <app-payload-input class="payload-input" formControlName="payload" [format]="format()" />

  @if (publishError(); as message) {
    <p class="error">{{ message }}</p>
  }

  <div class="actions">
    @if (templateSaved()) {
      <span class="flash">✓ Saved as template</span>
    }
    <button type="button" class="btn-save-template" (click)="openLoadModal()">
      Load Template
    </button>
    <button
      type="button"
      class="btn-save-template"
      [disabled]="form.invalid || payloadInvalid()"
      (click)="openSaveModal()"
    >
      Save as Template
    </button>
    <button
      type="submit"
      class="btn-publish"
      [disabled]="form.invalid || payloadInvalid() || !connected()"
      [title]="connected() ? '' : 'Connect to the broker to publish'"
    >
      Publish
    </button>
  </div>
</form>

@if (saveModalDraft(); as draft) {
  <app-save-template-modal
    [draft]="draft"
    (close_modal)="closeSaveModal()"
    (saved)="onTemplateSaved()"
  />
}

@if (showLoadModal()) {
  <app-load-template-modal
    (close_modal)="closeLoadModal()"
    (selected)="onTemplateSelected($event)"
  />
}
