<header class="panel-header">
  @if (tools.length > 1) {
    <div class="segmented" role="tablist" aria-label="Workspace tools">
      @for (tool of tools; track tool.id) {
        <div
          #tab
          class="segment"
          [class.selected]="activeTool() === tool.id"
          (click)="selectTool(tool.id)"
          (keydown)="onSwitcherKeydown($event)"
          role="tab"
          [attr.aria-selected]="activeTool() === tool.id"
          [tabindex]="activeTool() === tool.id ? 0 : -1"
          [title]="tool.label"
        >
          {{ tool.label }}
        </div>
      }
    </div>
  } @else {
    <span class="panel-title">{{ tools[0].label }}</span>
  }
</header>

<div class="panel-body">
  @switch (activeTool()) {
    @case ("charts") {
      <app-value-charts
        [connectionId]="connectionId()"
        [selectedTopic]="selectedTopic()"
        [wide]="wide()"
        [paused]="paused()"
      />
    }
  }
</div>
