<div class="overlay">
  <button
    type="button"
    class="backdrop"
    aria-label="Close dialog"
    (click)="onBackdropClick()"
  ></button>
  <div class="panel" role="dialog" aria-modal="true">
    <div class="panel-header">
      <h2>{{ title() }}</h2>
      <button
        type="button"
        class="close-button"
        (click)="close_modal.emit()"
        aria-label="Close"
      >
        ×
      </button>
    </div>
    <div class="panel-body">
      <ng-content></ng-content>
    </div>
  </div>
</div>
