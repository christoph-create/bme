<button
  type="button"
  class="home"
  [class.active]="homeActive()"
  aria-label="Broker list"
  title="Broker list"
  (click)="goHome()"
>
  <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
    <path
      d="M1.5 6.2 7 1.6l5.5 4.6M3 5.4v6.6h8V5.4"
      fill="none"
      stroke="currentColor"
      stroke-width="1.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</button>

@for (id of openIds(); track id) {
  <button
    type="button"
    class="tab"
    [class.active]="activeId() === id"
    [attr.aria-current]="activeId() === id ? 'page' : null"
    [title]="nameOf(id)"
    (click)="activate(id)"
  >
    <app-status-dot [status]="statusOf(id)" />
    <span class="tab-name">{{ nameOf(id) }}</span>
  </button>
}

<button
  type="button"
  class="settings"
  [class.active]="onSettings()"
  aria-label="Settings"
  title="Settings"
  (click)="goSettings()"
>
  <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
    <circle
      cx="7"
      cy="7"
      r="2.1"
      fill="none"
      stroke="currentColor"
      stroke-width="1.3"
    />
    <path
      d="M7 1.2v1.6M7 11.2v1.6M1.2 7h1.6M11.2 7h1.6M2.9 2.9l1.13 1.13M9.97 9.97l1.13 1.13M2.9 11.1l1.13-1.13M9.97 4.03l1.13-1.13"
      fill="none"
      stroke="currentColor"
      stroke-width="1.3"
      stroke-linecap="round"
    />
  </svg>
</button>
