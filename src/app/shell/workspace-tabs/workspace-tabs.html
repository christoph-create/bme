<button
  type="button"
  class="home"
  [class.active]="activeId() === null"
  aria-label="Broker list"
  title="Broker list"
  (click)="goHome()"
>
  <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
    <path
      d="M1.5 6.2 7 1.6l5.5 4.6M3 5.4v6.6h8V5.4"
      fill="none"
      stroke="currentColor"
      stroke-width="1.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</button>

@for (id of openIds(); track id) {
  <button
    type="button"
    class="tab"
    [class.active]="activeId() === id"
    [attr.aria-current]="activeId() === id ? 'page' : null"
    [title]="nameOf(id)"
    (click)="activate(id)"
  >
    <app-status-dot [status]="statusOf(id)" />
    <span class="tab-name">{{ nameOf(id) }}</span>
  </button>
}
